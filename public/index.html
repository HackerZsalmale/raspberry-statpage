<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">

    <div class="top">
      <div>
        <h1>Raspberry Pi Monitor</h1>
        <span class="host" id="host">local network</span>
      </div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>

    <div class="grid">

      <div class="panel" data-metric="cpu">
        <p class="label">CPU</p>
        <p class="readout"><span id="cpuValue">--</span><span class="unit">%</span></p>
        <div class="meter" id="cpuMeter"></div>
        <svg class="spark" id="cpuSpark" viewBox="0 0 100 32" preserveAspectRatio="none">
          <polyline class="fill" points=""></polyline>
          <polyline points=""></polyline>
        </svg>
      </div>

      <div class="panel" data-metric="ram">
        <p class="label">Memory</p>
        <p class="readout"><span id="ramValue">--</span><span class="unit">%</span></p>
        <div class="meter" id="ramMeter"></div>
        <svg class="spark" id="ramSpark" viewBox="0 0 100 32" preserveAspectRatio="none">
          <polyline class="fill" points=""></polyline>
          <polyline points=""></polyline>
        </svg>
      </div>

      <div class="panel" data-metric="disk">
        <p class="label">Disk</p>
        <p class="readout"><span id="diskValue">--</span><span class="unit">%</span></p>
        <div class="meter" id="diskMeter"></div>
        <svg class="spark" id="diskSpark" viewBox="0 0 100 32" preserveAspectRatio="none">
          <polyline class="fill" points=""></polyline>
          <polyline points=""></polyline>
        </svg>
      </div>

    </div>

    <p class="foot">Last updated: <span id="time">--:--:--</span></p>

  </div>

  <script src="script.js"></script>
</body>
</html>
